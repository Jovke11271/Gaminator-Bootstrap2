<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaminator - Kontakt i Podrška</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stilovi.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top shadow">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold gaminator-plava" href="index.html">GAMINATOR</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Početna</a></li>
        <li class="nav-item"><a class="nav-link" href="igre.html">Igre</a></li>
        <li class="nav-item"><a class="nav-link" href="profil.html">Profil</a></li>
        <li class="nav-item"><a class="nav-link" href="podesavanja.html">Podešavanja</a></li>
        <li class="nav-item"><a class="nav-link active" href="kontakt.html">Kontakt</a></li>
      </ul>
      <span class="navbar-text text-success fw-bold fs-5">
        <img src="slike/koin.png" width="20" alt="coin"> 3500
      </span>
    </div>
  </div>
</nav>

<div class="container my-5 d-flex justify-content-center">
    <div class="card bg-dark text-white border-secondary shadow p-4 w-100" style="max-width: 600px;">
        <h2 class="mb-4 text-center gaminator-plava">Контакт & Подршка</h2>
        <p class="text-muted text-center mb-4">Имате питање или желите да пријавите проблем? Попуните формулар.</p>
        
        <form action="#" method="POST">
            
            <div class="mb-3">
                <label for="korisnickoIme" class="form-label">Корисничко име (Tekst)</label>
                <input type="text" class="form-control bg-secondary text-white border-dark" id="korisnickoIme" placeholder="Унесите ваше корисничко име" required>
            </div>

            <div class="mb-3">
                <label for="idKorisnika" class="form-label">ID Корисника (Broj)</label>
                <input type="number" class="form-control bg-secondary text-white border-dark" id="idKorisnika" placeholder="Нпр. 12345">
            </div>

            <div class="mb-3">
                <label for="datumRodjenja" class="form-label">Датум рођења (Datum)</label>
                <input type="date" class="form-control bg-secondary text-white border-dark" id="datumRodjenja" required>
            </div>

            <div class="mb-3">
                <label for="kategorijaProblema" class="form-label">Врста упита (Izbor вредности)</label>
                <select class="form-select bg-secondary text-white border-dark" id="kategorijaProblema">
                    <option selected disabled value="">Изаберите опцију...</option>
                    <option value="1">Проблем са уплатом/исплатом коина</option>
                    <option value="2">Грешка у самој слот игри</option>
                    <option value="3">Питање у вези са налогом</option>
                    <option value="4">Остало</option>
                </select>
            </div>

            <div class="mb-3">
                <label for="hitnost" class="form-label">Колико је хитан ваш проблем? (Opseg)</label>
                <input type="range" class="form-range" min="1" max="5" id="hitnost">
                <div class="d-flex justify-content-between text-muted fs-7">
                    <span>Није хитно</span>
                    <span>Критично</span>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label d-block">Да ли сте пунолетни? (Radio)</label>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="punoletstvo" id="radioDa" value="da" checked>
                    <label class="form-check-label" for="radioDa">Да</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="punoletstvo" id="radioNe" value="ne">
                    <label class="form-check-label" for="radioNe">Не</label>
                </div>
            </div>

            <div class="mb-3">
                <label for="poruka" class="form-label">Детаљан опис проблема (Duži tekst)</label>
                <textarea class="form-control bg-secondary text-white border-dark" id="poruka" rows="4" placeholder="Напишите вашу поруку овде..."></textarea>
            </div>

            <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="usloviKoriscenja" required>
                <label class="form-check-label text-muted" for="usloviKoriscenja">Прихватам услове коришћења и полису приватности. (Čekboks)</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">ПОШАЉИ КАРТИЦУ ПОДРШКЕ</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
