<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaminator - Profil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stilovi.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top shadow">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold gaminator-plava" href="index.html">GAMINATOR</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="index.html">Početna</a></li>
        <li class="nav-item"><a class="nav-link" href="igre.html">Igre</a></li>
        <li class="nav-item"><a class="nav-link" href="profil.html">Profil</a></li>
        <li class="nav-item"><a class="nav-link" href="podesavanja.html">Podešavanja</a></li>
        <li class="nav-item"><a class="nav-link" href="kontakt.html">Kontakt</a></li>
      </ul>
      <span class="navbar-text text-success fw-bold fs-5">
        <img src="slike/koin.png" width="20" alt="coin"> 3500
      </span>
    </div>
  </div>
</nav>

<div class="container mt-5 pt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark text-white border-primary shadow mb-4">
                <div class="card-body text-center py-4">
                    <img src="profilna.jpg" width="120" height="120" class="rounded-circle mb-3 border border-primary p-1" alt="Profilna slika">
                    <h2 class="fw-bold">Radenko</h2>
                    <span class="badge bg-danger fs-6 text-uppercase">Status: Pro Player</span>
                </div>
            </div>

            <div class="card bg-dark text-white border-secondary shadow p-4">
                <h4 class="mb-3 border-bottom pb-2 gaminator-plava">Izmeni podatke</h4>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Novo korisničko ime</label>
                        <input type="text" class="form-control custom-input" placeholder="Unesite ime" value="Radenko">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Datum rođenja</label>
                        <input type="date" class="form-control custom-input">
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block">Pol</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="pol" id="m" checked>
                            <label class="form-check-label" for="m">Muški</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="pol" id="z">
                            <label class="form-check-label" for="z">Ženski</label>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2">SAČUVAJ IZMENE</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
