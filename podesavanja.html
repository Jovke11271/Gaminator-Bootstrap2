<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaminator - Podešavanja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="stilovi.css">
</head>
<body>

<nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top shadow">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold gaminator-plava" href="index.html">GAMINATOR</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link active" href="index.html">Početna</a></li>
        <li class="nav-item"><a class="nav-link" href="igre.html">Igre</a></li>
        <li class="nav-item"><a class="nav-link" href="profil.html">Profil</a></li>
        <li class="nav-item"><a class="nav-link" href="podesavanja.html">Podešavanja</a></li>
        <li class="nav-item"><a class="nav-link" href="kontakt.html">Kontakt</a></li>
      </ul>
      <span class="navbar-text text-success fw-bold fs-5">
        <img src="slike/koin.png" width="20" alt="coin"> 3500
      </span>
    </div>
  </div>
</nav>

<div class="container mt-5 pt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-dark text-white border-secondary shadow p-4 mb-4">
                <h4 class="mb-4 border-bottom pb-2">Opšta Podešavanja</h4>
                <div class="form-check form-switch mb-3 fs-5">
                    <input class="form-check-input" type="checkbox" id="z1" checked>
                    <label class="form-check-label" for="z1">Zvukovi igre</label>
                </div>
                <div class="form-check form-switch mb-3 fs-5">
                    <input class="form-check-input" type="checkbox" id="z2">
                    <label class="form-check-label" for="z2">Notifikacije</label>
                </div>
            </div>

            <div class="card bg-dark text-white border-danger shadow p-4">
                <h4 class="text-danger mb-3 border-bottom pb-2">Prijavi problem</h4>
                <form>
                    <div class="row mb-3">
                        <div class="col">
                            <label class="form-label">Poslednji ulog</label>
                            <input type="number" class="form-control custom-input" placeholder="0">
                        </div>
                        <div class="col">
                            <label class="form-label">Tip igre</label>
                            <select class="form-select custom-input">
                                <option selected>Slotovi</option>
                                <option>Rulet</option>
                                <option>Karte</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Jačina problema (1-10)</label>
                        <input type="range" class="form-range" min="1" max="10">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Opis situacije</label>
                        <textarea class="form-control custom-input" rows="3" placeholder="Šta se desilo?"></textarea>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" id="potvrda">
                        <label class="form-check-label" for="potvrda">Slažem se sa uslovima</label>
                    </div>
                    <button type="submit" class="btn btn-danger w-100 fw-bold py-2">POŠALJI IZVEŠTAJ</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
